name: Build and Release

# Thin wrapper around the canonical reusable workflow in claude-env. The actual
# pipeline (NuGet vulnerability scan → publish self-contained → zip + checksum
# → GitHub Release) lives at:
#   psford/claude-env/.github/workflows/windows-service-build-release.yml
#
# Only the three project-specific values (app name, project path, default
# appsettings path) live here. To change the pipeline itself, edit the
# reusable workflow in claude-env so the change applies to SysTTS AND
# whisper-service at once.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: psford/claude-env/.github/workflows/windows-service-build-release.yml@main
    with:
      app_name: SysTTS
      project_path: src/SysTTS/SysTTS.csproj
      appsettings_source: src/SysTTS/appsettings.json
    permissions:
      contents: write
